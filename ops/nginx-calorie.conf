server {
    server_name 20-46-181-25.nip.io 20.46.181.25;

    # 1. 網頁前端介面
    location / {
        root /var/www/calorie-app;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 帶 hash 檔名的靜態資源永遠不會變內容，可以放心長期快取
    location /_expo/static/ {
        root /var/www/calorie-app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. 後端 API 轉發
    location /api/ {
        proxy_pass http://127.0.0.1:3000/; # 轉發給本機 PM2 跑的 Node.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 10m; # 允許手機/網頁上傳最大 10MB 的照片
    }

    # 3. 後台管理介面
    location /admin/ {
        proxy_pass http://127.0.0.1:3000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/20-46-181-25.nip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/20-46-181-25.nip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = 20-46-181-25.nip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name 20-46-181-25.nip.io 20.46.181.25;

    listen 80;
    return 404; # managed by Certbot


}
# 用「點」分隔的 nip.io 網址（20.46.181.25.nip.io）一律 301 轉到正式網址（連字號版）。
# 網頁版的 Google 登入會把「目前網址」當導回網址，Google Console 只登記了連字號版，
# 用點的網址開就會 redirect_uri_mismatch；統一轉址後不管使用者打哪一種都正常。
# 憑證已經涵蓋兩種網址（certbot --expand），所以 https 的點網址也不會跳憑證警告。
# 轉址寫在 location / 而不是 server 層級，certbot 續約時插入的驗證路徑才能優先生效。
server {
    listen 443 ssl;
    server_name 20.46.181.25.nip.io;
    ssl_certificate /etc/letsencrypt/live/20-46-181-25.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/20-46-181-25.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        return 301 https://20-46-181-25.nip.io$request_uri;
    }
}
server {
    listen 80;
    server_name 20.46.181.25.nip.io;
    location / {
        return 301 https://20-46-181-25.nip.io$request_uri;
    }
}
