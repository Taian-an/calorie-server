# /api 轉發給 Node.js。app.calorietracks.com 和舊的 nip.io 網址都會 include（舊網址只剩這個，給已安裝的舊版 App 用）
# 2. 後端 API 轉發
location /api/ {
    proxy_pass http://127.0.0.1:3000/; # 轉發給本機 PM2 跑的 Node.js
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 讓 Node 看到真實 IP，限流才會一人一份
    proxy_cache_bypass $http_upgrade;

    client_max_body_size 10m; # 允許手機/網頁上傳最大 10MB 的照片
}
