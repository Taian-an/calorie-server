# 網頁版 App + /api + /admin 的路由，app.calorietracks.com 和舊的 nip.io 網址共用同一份
# 1. 網頁前端介面
location / {
    root /var/www/calorie-app;
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
}

# 帶 hash 檔名的靜態資源永遠不會變內容，可以放心長期快取
location /_expo/static/ {
    root /var/www/calorie-app;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# 2. 後端 API 轉發
location /api/ {
    proxy_pass http://127.0.0.1:3000/; # 轉發給本機 PM2 跑的 Node.js
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;

    client_max_body_size 10m; # 允許手機/網頁上傳最大 10MB 的照片
}

# 3. 後台管理介面
location /admin/ {
    proxy_pass http://127.0.0.1:3000/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
