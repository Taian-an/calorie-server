<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Analyses</title>

<link rel="stylesheet" href="css/users.css">
<style>
    /* 只有這頁用到的樣式：統計卡、狀態標籤、展開的組成明細 */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .stat { background: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .stat .label { font-size: 13px; color: #6b7280; }
    .stat .value { font-size: 24px; font-weight: 700; margin-top: 6px; }
    .stat .sub { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; }
    .filters select { padding: 8px 10px; border-radius: 8px; border: 1px solid #d1d5db; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.done { background: #dcfce7; color: #166534; }
    .badge.failed { background: #fee2e2; color: #991b1b; }
    .badge.pending { background: #fef3c7; color: #92400e; }
    .badge.premium { background: #ede9fe; color: #5b21b6; margin-left: 6px; }
    tr.row { cursor: pointer; }
    tr.row:hover td { background: #f9fafb; }
    tr.detail td { background: #f9fafb; font-size: 13px; color: #374151; }
    .muted { color: #9ca3af; }
    .pagination { display: flex; gap: 12px; align-items: center; justify-content: flex-end; margin-top: 16px; }
</style>
</head>

<body>

    <div class="container">

    <!-- Sidebar -->
        <div class="sidebar">

            <h2>🥗 Calorie AI</h2>

            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="users.html">Users</a></li>
                <li class="active"><a href="analyses.html">AI Analyses</a></li>
                <li><a href="feedback.html">Feedback</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="#" onclick="adminLogout(); return false;">Logout</a></li>
            </ul>

        </div>

    <!-- Main -->
        <div class="main">

            <div class="header">
                <h1>AI Analyses</h1>
            </div>

            <div class="stats" id="stats"></div>

            <div class="card">

                <div class="top-bar">
                    <h2>All Analyses</h2>
                </div>

                <div class="search-bar filters">
                    <input type="text" id="searchInput" placeholder="Search food or user email...">
                    <select id="statusFilter">
                        <option value="">All statuses</option>
                        <option value="done">Success</option>
                        <option value="failed">Failed</option>
                        <option value="pending">Pending</option>
                    </select>
                    <button onclick="searchAnalyses()">Search</button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>User</th>
                            <th>Food</th>
                            <th>Energy (kcal)</th>
                            <th>P / C / F (g)</th>
                            <th>Confidence</th>
                            <th>Model</th>
                            <th>AI time</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="analysisTable"></tbody>
                </table>

                <div class="pagination">
                    <button id="prevPageBtn" onclick="changePage(-1)">← Prev</button>
                    <span id="pageInfo"></span>
                    <button id="nextPageBtn" onclick="changePage(1)">Next →</button>
                </div>

            </div>

        </div>

    </div>

    <script src="js/i18n.js"></script>
    <script src="js/adminAuth.js"></script>
    <script src="js/analyses.js"></script>

</body>
</html>
