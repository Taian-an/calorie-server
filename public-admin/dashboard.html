<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<link rel="stylesheet" href="css/dashbord.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="sidebar">

        <h2>🥗 Calorie AI</h2>

        <ul>

            <li class="active">Dashboard</li>

            <li ><a href="users.html">Users</a></li>
            <li><a href="analyses.html">AI Analyses</a></li>


            <li><a href="feedback.html">Feedback</a></li>

            <li><a href="settings.html">Settings</a></li>

            <li><a href="#" onclick="adminLogout(); return false;">Logout</a></li>

        </ul>

    </div>

    <div class="main">

        <div class="header">

            <h1>Dashboard</h1>

            <span>Welcome, Admin</span>

        </div>

        <div class="cards">

            <div class="card">

                <h3>Total Users</h3>

                <h2 id="statTotalUsers">—</h2>

            </div>

            <div class="card">

                <h3>Today's Upload</h3>

                <h2 id="statTodayUploads">—</h2>

            </div>

            <div class="card">

                <h3>Feedback</h3>

                <h2 id="statTotalFeedback">—</h2>

            </div>

            <div class="card">

                <h3>Gemini API</h3>

                <h2 id="statGeminiStatus">—</h2>

            </div>

        </div>

        <div class="table-box">

            <h2>Recent Users</h2>

            <table>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Plan</th>

                </tr>

                <tbody id="recentUsersTable"></tbody>

            </table>

        </div>

    </div>

</div>

<script src="js/i18n.js"></script>
<script src="js/adminAuth.js"></script>
<script src="js/dashboard.js"></script>

</body>

</html>
