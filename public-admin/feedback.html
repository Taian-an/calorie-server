<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feedback</title>

<link rel="stylesheet" href="css/users.css">
<link rel="stylesheet" href="css/food.css">
</head>

<body>

    <div class="container">

    <!-- Sidebar -->
        <div class="sidebar">

            <h2>🥗 Calorie AI</h2>

            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="users.html">Users</a></li>
                <li class="active"><a href="feedback.html">Feedback</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="#" onclick="adminLogout(); return false;">Logout</a></li>
            </ul>

        </div>

    <!-- Main -->
        <div class="main">

            <div class="header">
                <h1>Feedback</h1>
            </div>

            <div class="card">

                <div class="top-bar">
                    <h2>User Feedback</h2>
                </div>

                <div class="search-bar" style="gap: 8px;">
                    <button class="filter-btn active" data-status="">All</button>
                    <button class="filter-btn" data-status="new">New</button>
                    <button class="filter-btn" data-status="reviewed">Reviewed</button>
                </div>

                <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Message</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="feedbackTable"></tbody>

                </table>

                <div class="pagination">
                    <button id="prevPageBtn" onclick="changePage(-1)">← Prev</button>
                    <span id="pageInfo"></span>
                    <button id="nextPageBtn" onclick="changePage(1)">Next →</button>
                </div>

            </div>

        </div>

    </div>

    <script src="js/i18n.js"></script>
<script src="js/adminAuth.js"></script>
    <script src="js/feedback.js"></script>

    </body>
</html>
